name: terraform-ci

# Valida el código Terraform de prod en cada Pull Request hacia main: fmt,
# validate y plan. Es de solo lectura contra Azure (plan no modifica nada),
# así que corre sin gate de aprobación humana.

on:
  pull_request:
    branches: [main]
    paths:
      - "modules/**"
      - "envs/prod/**"
      - "policies/**"

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  # Bloque 3.3 (DevSecOps, ADR-08): escaneo estático de seguridad con tfsec
  # sobre todo el árbol de Terraform (modules/, envs/, policies/). Va como
  # job separado, no como step dentro de "plan": no necesita login en Azure
  # ni terraform init, así que corre en paralelo y no depende de que fmt/
  # validate/plan pasen. soft_fail:true = solo anota hallazgos en el log del
  # job, nunca lo pone en rojo ni bloquea el PR — la barrera dura sigue
  # siendo la revisión humana del plan.
  tfsec:
    name: tfsec (no bloqueante)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aquasecurity/tfsec-action@b466648d6e39e7c75324f25d83891162a721f2d6 # v1.0.3
        with:
          soft_fail: true

  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: envs/prod
    # A nivel de job, no de step: cada invocación de "terraform" que toca el
    # backend remoto (init, plan, apply) reautentica por separado — si estas
    # variables solo viven en el step de "init", el resto de comandos caen a
    # autenticación por clave de la cuenta de almacenamiento y fallan con
    # 403 (el Service Principal solo tiene RBAC de datos, no listKeys).
    env:
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: terraform fmt
        run: terraform fmt -check -recursive ..

      - name: terraform init
        run: terraform init -backend-config=backend.hcl

      - name: terraform validate
        run: terraform validate

      - name: terraform plan
        run: |
          set -euo pipefail
          # prod.tfvars (versionado) solo trae placeholders. -var-file en la
          # línea de comandos tiene MÁS prioridad que las variables de
          # entorno TF_VAR_*, así que un TF_VAR_* nunca podría sobrescribir
          # lo que ya viene de -var-file=prod.tfvars: hace falta un segundo
          # -var-file generado en el runner, igual que local.tfvars en local.
          jq -n \
            --arg tenant_id "$TENANT_ID" \
            --arg subscription_id "$SUBSCRIPTION_ID" \
            --arg hub_vnet_id "$HUB_VNET_ID" \
            --arg aad_admin_login "$AAD_ADMIN_LOGIN" \
            --arg aad_admin_object_id "$AAD_ADMIN_OBJECT_ID" \
            --arg deployer_principal_id "$DEPLOYER_PRINCIPAL_ID" \
            --arg servicebus_diagnostics_principal_id "$SERVICEBUS_DIAGNOSTICS_PRINCIPAL_ID" \
            --arg novapay_functions_sp_principal_id "$NOVAPAY_FUNCTIONS_SP_PRINCIPAL_ID" \
            --arg alert_email "$ALERT_EMAIL" \
            --arg apim_publisher_email "$APIM_PUBLISHER_EMAIL" \
            '{tenant_id:$tenant_id, subscription_id:$subscription_id, hub_vnet_id:$hub_vnet_id, aad_admin_login:$aad_admin_login, aad_admin_object_id:$aad_admin_object_id, deployer_principal_id:$deployer_principal_id, servicebus_diagnostics_principal_id:$servicebus_diagnostics_principal_id, novapay_functions_sp_principal_id:$novapay_functions_sp_principal_id, alert_email:$alert_email, apim_publisher_email:$apim_publisher_email}' \
            > ci.tfvars.json

          terraform plan -input=false -var-file=prod.tfvars -var-file=ci.tfvars.json -no-color | tee plan_output.txt
          {
            echo "### Terraform plan — prod (PR #${{ github.event.pull_request.number }})"
            echo '```'
            cat plan_output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TENANT_ID: ${{ secrets.TF_VAR_TENANT_ID }}
          SUBSCRIPTION_ID: ${{ secrets.TF_VAR_SUBSCRIPTION_ID }}
          HUB_VNET_ID: ${{ secrets.TF_VAR_HUB_VNET_ID }}
          AAD_ADMIN_LOGIN: ${{ secrets.TF_VAR_AAD_ADMIN_LOGIN }}
          AAD_ADMIN_OBJECT_ID: ${{ secrets.TF_VAR_AAD_ADMIN_OBJECT_ID }}
          DEPLOYER_PRINCIPAL_ID: ${{ secrets.TF_VAR_DEPLOYER_PRINCIPAL_ID }}
          SERVICEBUS_DIAGNOSTICS_PRINCIPAL_ID: ${{ secrets.TF_VAR_SERVICEBUS_DIAGNOSTICS_PRINCIPAL_ID }}
          NOVAPAY_FUNCTIONS_SP_PRINCIPAL_ID: ${{ secrets.TF_VAR_NOVAPAY_FUNCTIONS_SP_PRINCIPAL_ID }}
          ALERT_EMAIL: ${{ secrets.TF_VAR_ALERT_EMAIL }}
          APIM_PUBLISHER_EMAIL: ${{ secrets.TF_VAR_APIM_PUBLISHER_EMAIL }}
